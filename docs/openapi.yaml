openapi: 3.1.0
info:
  title: SIMPLEIN SCHOOL ERP API (V1)
  description: |
    Multi-tenant school ERP by SIMPLEIN SOLUTIONS LLP. Records-only fee
    tracking (NO online payments). Every endpoint enforces authentication,
    RBAC, and tenant isolation server-side; cross-tenant ids return 404.
    Generated by scripts/generate-openapi.mjs (Phase 13).
  version: 1.0.0
servers:
  - url: /api/v1
    description: Same-origin REST API
tags:
  - name: system
  - name: auth
  - name: onboarding
  - name: schools
  - name: users
  - name: teachers
  - name: parents
  - name: students
  - name: academic-structure
  - name: attendance
  - name: exams
  - name: marks
  - name: grades
  - name: report-cards
  - name: timetable
  - name: homework
  - name: notices
  - name: notifications
  - name: fees
  - name: promotions
  - name: pyqs
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      description: Supabase Auth session (httpOnly, SameSite=Lax).
    onboardingSecret:
      type: http
      scheme: bearer
      description: Server-only ONBOARDING_SECRET (not a user session).
  schemas:
    Envelope:
      type: object
      description: Success { data, meta? } or error { error: { code, message } }.
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
    Pagination:
      type: object
      properties:
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer }
security:
  - sessionCookie: []
paths:
  /api/v1/health:
    get:
      tags: [system]
      summary: Liveness probe (no auth)
      responses:
        "200":
          description: Success (envelope).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        "401":
          description: Unauthenticated (except no-auth endpoints).
        "403":
          description: Forbidden (role/permission failure; onboarding secret invalid).
        "404":
          description: Not found OR cross-tenant id (existence not leaked).
        "409":
          description: Conflict (duplicates, locked marks, double-booking, overpayment).
        "422":
          description: Validation error (Zod).
        "429":
          description: Rate limited (Retry-After header).
      security:
